<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排课系统</title>
<style>:root{--pk-bg:#f5f6f8;--pk-fg:#222;--pk-muted:#777;--pk-line:#d9dce1;--pk-card:#fff;--pk-primary:#2f6fdb;--pk-danger:#d64545;--pk-warn:#e6a23c;--pk-ok:#3a9d5d}
*{box-sizing:border-box}
body{margin:0;background:var(--pk-bg);color:var(--pk-fg);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.pk-header{display:flex;align-items:center;gap:24px;padding:0 16px;height:52px;background:#1f2d3d;color:#fff;position:sticky;top:0;z-index:10}
.pk-brand{font-weight:600;font-size:16px;white-space:nowrap}
#pk-title{font-weight:400;opacity:.75;font-size:13px;margin-left:6px}
.pk-tabs{display:flex;gap:4px;overflow-x:auto}
.pk-tab{background:none;border:0;color:#cfd8e3;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap}
.pk-tab:hover{background:#2e4258;color:#fff}
.pk-tab.active{background:var(--pk-primary);color:#fff}
#pk-main{padding:16px}
.pk-card{background:var(--pk-card);border:1px solid var(--pk-line);border-radius:8px;padding:14px}
.pk-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pk-btn{border:1px solid var(--pk-line);background:#fff;color:var(--pk-fg);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.pk-btn:hover{border-color:var(--pk-primary);color:var(--pk-primary)}
.pk-btn:disabled{opacity:.45;cursor:not-allowed}
.pk-btn-primary{background:var(--pk-primary);border-color:var(--pk-primary);color:#fff}
.pk-btn-primary:hover{color:#fff;filter:brightness(1.08)}
.pk-btn-danger{color:var(--pk-danger);border-color:#f0c4c4}
.pk-btn-danger:hover{background:var(--pk-danger);color:#fff;border-color:var(--pk-danger)}
.pk-input,.pk-select{border:1px solid var(--pk-line);border-radius:6px;padding:5px 8px;font-size:13px;background:#fff;color:inherit}
.pk-table{border-collapse:collapse;width:100%;background:#fff}
.pk-table th,.pk-table td{border:1px solid var(--pk-line);padding:6px 8px;text-align:left}
.pk-table th{background:#f0f2f5;font-weight:600}
.pk-muted{color:var(--pk-muted)}
.pk-badge{display:inline-block;padding:0 6px;border-radius:9px;font-size:12px;background:#eef1f5}
.pk-badge-err{background:#fde2e2;color:var(--pk-danger)}
.pk-badge-ok{background:#e1f3e8;color:var(--pk-ok)}
.pk-badge-warn{background:#fdf0dc;color:#a66d12}
.pk-modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.pk-modal{background:#fff;border-radius:10px;min-width:320px;max-width:640px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.pk-modal-h{padding:12px 16px;font-weight:600;border-bottom:1px solid var(--pk-line)}
.pk-modal-b{padding:16px;overflow:auto}
.pk-modal-f{padding:10px 16px;border-top:1px solid var(--pk-line);display:flex;justify-content:flex-end;gap:8px}
#pk-toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.pk-toast{padding:8px 14px;border-radius:6px;color:#fff;background:#333;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:13px}
.pk-toast-ok{background:var(--pk-ok)}.pk-toast-warn{background:var(--pk-warn)}.pk-toast-err{background:var(--pk-danger)}
@media print{.pk-header,.pk-noprint,#pk-toast{display:none!important}#pk-main{padding:0}body{background:#fff}}

/* app.css — 成员 B：课表 / 检查页样式 */
.pk-tt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;background:#fff;border:1px solid var(--pk-line);border-radius:8px;padding:8px 10px}
.pk-tt-sp{flex:1 1 auto}
.pk-tt-pick{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.pk-tt-pick .pk-select{min-width:120px}
.pk-seg{display:inline-flex}
.pk-seg .pk-btn{border-radius:0;margin-left:-1px}
.pk-seg .pk-btn:first-child{border-radius:6px 0 0 6px;margin-left:0}
.pk-seg .pk-btn:last-child{border-radius:0 6px 6px 0}
.pk-seg .pk-btn.active{background:var(--pk-primary);border-color:var(--pk-primary);color:#fff;position:relative;z-index:1}

.pk-tt-layout{display:flex;gap:14px;align-items:flex-start}
.pk-tt-mainpane{flex:1 1 auto;min-width:0}
.pk-tt-side{flex:0 0 260px;width:260px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.pk-tt-title{font-size:18px;margin:0 0 10px;text-align:center;font-weight:600}
.pk-tt-tip{font-size:12px;margin:8px 0 0}
.pk-tt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}

/* 课表网格 */
.pk-grid{border-collapse:collapse;background:#fff;width:100%;table-layout:fixed}
.pk-grid th,.pk-grid td{border:1px solid #c9ced6;text-align:center;vertical-align:middle}
.pk-grid thead th{background:#eef1f5;font-weight:600;padding:6px 4px;font-size:13px}
.pk-grid-class{min-width:560px}
.pk-grid-class .pk-g-corner,.pk-grid-class .pk-g-period{width:72px}
.pk-g-period{background:#f6f7f9;font-weight:600;font-size:13px;white-space:nowrap}
.pk-grid-class td.pk-cell{height:64px;padding:3px}
.pk-break td{background:#fafbfc;color:var(--pk-muted);font-size:12px;letter-spacing:4px;padding:2px;height:auto}

.pk-cell{position:relative;cursor:pointer;transition:background .1s}
.pk-cell-empty:hover{background:#f2f7ff}
.pk-empty-mark{color:#c8ccd2;font-size:18px;line-height:1}
.pk-cell-empty:hover .pk-empty-mark{color:var(--pk-primary)}
.pk-lesson{border-left:4px solid #999;border-radius:4px;padding:4px 6px;height:100%;min-height:52px;display:flex;flex-direction:column;justify-content:center;text-align:left;overflow:hidden}
.pk-cell:hover .pk-lesson{filter:brightness(.96)}
.pk-l-main{font-weight:600;font-size:14px;line-height:1.3;word-break:break-all}
.pk-l-sub{font-size:12px;color:#555;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-lock{font-size:11px;margin-left:3px}
.pk-warn-ic{color:var(--pk-danger);font-weight:700;margin-right:2px}
.pk-cell-conf{outline:2px solid var(--pk-danger);outline-offset:-2px}
.pk-cell-conf .pk-lesson{box-shadow:inset 0 0 0 1px rgba(214,69,69,.3)}
.pk-cell[draggable=true]{cursor:grab}
.pk-dragging{opacity:.45}
.pk-drop-ok{background:#e1f3e8!important;outline:2px dashed var(--pk-ok);outline-offset:-3px}
.pk-drop-bad{background:#fde2e2!important;outline:2px dashed var(--pk-danger);outline-offset:-3px}
.pk-drop-no{cursor:not-allowed;background:#f3f3f3!important}
.pk-hl{animation:pk-hl-pulse 1s ease-in-out 4;outline:3px solid var(--pk-warn)!important;outline-offset:-3px}
@keyframes pk-hl-pulse{0%,100%{background:#fff}50%{background:#ffe9b8}}

/* 老师课表 */
.pk-cell-t{cursor:default;padding:3px;height:64px}
.pk-t-item{cursor:pointer}
.pk-t-item + .pk-t-item{margin-top:3px}
.pk-cell-t .pk-lesson{min-height:0}
.pk-t-total{text-align:right!important;padding:8px 10px;background:#f6f7f9;font-size:14px}

/* 总表 */
.pk-grid-all{min-width:calc(110px + var(--pk-cols,9) * 74px);font-size:12px}
.pk-grid-all thead th{position:sticky;top:0;z-index:2;font-size:12px;padding:4px 2px}
.pk-grid-all .pk-g-day{width:34px;writing-mode:vertical-rl;letter-spacing:2px;background:#eef1f5}
.pk-grid-all .pk-g-period{width:60px;font-size:12px}
.pk-grid-all td.pk-cell{height:38px;padding:1px}
.pk-grid-all tr.pk-day-start>*{border-top:2px solid #8a94a3}
.pk-lesson-c{min-height:34px;padding:1px 4px;font-weight:600;font-size:12px;border-left-width:3px;line-height:1.25}
.pk-lesson-c .pk-l-main{font-size:12px}
.pk-lesson-c .pk-l-sub{font-weight:400;font-size:11px}
.pk-grid-all .pk-empty-mark{font-size:13px}

/* 侧栏教学任务 */
.pk-side-h{font-weight:600;margin-bottom:4px}
.pk-side-sum{font-size:12px;margin-bottom:8px}
.pk-side-tip{font-size:12px;margin-top:8px}
.pk-plan{border-left:4px solid #999;border-radius:4px;padding:5px 8px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.pk-plan-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-plan-num{white-space:nowrap;font-size:12px}
.pk-plan-drag{cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pk-plan-drag:hover{box-shadow:0 2px 6px rgba(0,0,0,.15)}
.pk-grip{color:#999;margin-right:4px}

/* 编辑弹窗 */
.pk-ed-where{margin-bottom:8px}
.pk-ed-lockmsg{background:#fdf0dc;color:#8a5a0c;border-radius:6px;padding:6px 10px;margin-bottom:8px;font-size:13px}
.pk-ed-sec{font-weight:600;font-size:13px;margin:12px 0 6px;color:#444}
.pk-ed-quick{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow:auto}
.pk-ed-q{display:flex;align-items:center;gap:8px;border:1px solid var(--pk-line);border-left:4px solid #999;border-radius:6px;padding:6px 8px;cursor:pointer;text-align:left;font-size:13px;color:inherit}
.pk-ed-q:hover:not(:disabled){border-color:var(--pk-primary)}
.pk-ed-q:disabled{opacity:.5;cursor:not-allowed}
.pk-ed-q-name{flex:1 1 auto;font-weight:600}
.pk-ed-q-name .pk-muted{font-weight:400}
.pk-ed-q-num{font-size:12px;color:#555;white-space:nowrap}
.pk-ed-q{flex-wrap:wrap}
.pk-ed-q-why{flex-basis:100%;font-size:12px;color:var(--pk-muted)}
.pk-ed-q-whybad{color:var(--pk-danger)}
.pk-ed-manual{display:flex;gap:12px;flex-wrap:wrap}
.pk-ed-manual label{display:flex;align-items:center;gap:6px;font-size:13px}
.pk-ed-manual .pk-select{min-width:150px}
.pk-ed-hint{margin-top:8px;font-size:13px;min-height:20px}
.pk-ed-bad{color:var(--pk-danger);background:#fde2e2;border-radius:6px;padding:5px 8px;margin-bottom:4px}
.pk-ed-ok{color:var(--pk-ok);margin-bottom:4px}

/* 自动排课弹窗 */
.pk-auto-row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:10px}
.pk-auto label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}

/* 检查页 */
.pk-ck{display:flex;flex-direction:column;gap:14px}
.pk-ck-sec h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pk-ck-conf{list-style:none;margin:8px 0 0;padding:0}
.pk-ck-conf li{padding:6px 8px;border-bottom:1px dashed var(--pk-line)}
.pk-ck-conf li:last-child{border-bottom:0}
.pk-link{background:none;border:0;padding:0;color:var(--pk-primary);cursor:pointer;font-size:inherit;text-decoration:underline}
.pk-link:hover{color:#1d4fa8}
.pk-ck-opt{display:inline-flex;align-items:center;gap:4px;margin-bottom:8px;font-size:13px;cursor:pointer}
.pk-ck-plan .pk-ck-cls{background:#f6f7f9;vertical-align:top;white-space:nowrap}
.pk-row-warn td{background:#fff8e6}
.pk-row-err td{background:#fdecec}
.pk-sort{cursor:pointer;user-select:none;white-space:nowrap}
.pk-sort:hover{color:var(--pk-primary)}
.pk-ck-load td:nth-child(4),.pk-ck-load td:nth-child(5){font-size:12px}
.pk-ck .pk-table{min-width:520px}

/* 窄屏 */
.pk-tabs{min-width:0;flex:1 1 auto}
@media (max-width:820px){
  .pk-header{gap:10px;padding:0 10px}
  #pk-title{display:none}
  .pk-tt-layout{flex-direction:column;align-items:stretch}
  .pk-tt-mainpane{width:100%}
  .pk-tt-side{position:static;width:100%;flex:none;max-height:none}
  .pk-tt-sp{display:none}
  .pk-tt-title{font-size:16px}
}
@media (max-width:480px){
  #pk-main{padding:10px}
  .pk-grid-class{min-width:480px}
  .pk-grid-class .pk-g-corner,.pk-grid-class .pk-g-period{width:56px}
  .pk-l-main{font-size:13px}
}

/* 打印：只出课表 */
@media print{
  @page{size:A4 landscape;margin:10mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pk-tt-layout{display:block}
  .pk-tt-scroll{overflow:visible}
  .pk-grid{min-width:0!important;width:100%}
  .pk-grid-class td.pk-cell{height:70px}
  .pk-cell-empty .pk-empty-mark{visibility:hidden}
  .pk-hl{animation:none;outline:none!important}
  .pk-tt-title{font-size:20px;margin-bottom:12px}
  .pk-grid-all thead th{position:static}
  .pk-ck-sec{break-inside:avoid}
}

/* admin.css — 成员 C：基础数据 / 数据与导出 */
.pk-ad-layout{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}
.pk-ad-nav{display:flex;flex-direction:column;gap:4px;background:var(--pk-card);border:1px solid var(--pk-line);border-radius:8px;padding:8px;position:sticky;top:68px}
.pk-ad-navbtn{background:none;border:0;text-align:left;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--pk-fg)}
.pk-ad-navbtn:hover{background:#eef3fc;color:var(--pk-primary)}
.pk-ad-navbtn.active{background:var(--pk-primary);color:#fff}
.pk-ad-body{min-width:0}
.pk-ad-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pk-ad-h2{margin:0 0 2px;font-size:18px}
.pk-ad-desc{font-size:13px}
.pk-ad-table td{vertical-align:middle}
.pk-ad-table th{white-space:nowrap}
.pk-ad-table tbody tr:hover td{background:#fafbfd}
.pk-ad-empty{text-align:center;padding:24px!important}
.pk-ad-nowrap{white-space:nowrap}
.pk-ad-w-sort{width:84px}.pk-ad-w-ops{width:120px}.pk-ad-w-ops1{width:110px}.pk-ad-w-ops3{width:210px}.pk-ad-w-color{width:60px}.pk-ad-w-num{width:100px}
.pk-btn.pk-ad-sm{padding:2px 8px;font-size:12px}
.pk-ad-num{width:70px}
.pk-ad-wide{min-width:260px}
.pk-ad-color{width:40px;height:28px;padding:0;border:1px solid var(--pk-line);border-radius:4px;background:#fff;cursor:pointer}
.pk-ad-chip{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.pk-ad-tc{display:inline-block;margin:1px 10px 1px 0}
.pk-ad-unset{color:var(--pk-warn);border-color:#f3d39b}
.pk-ad-total td{background:#f7f8fa;font-weight:600}
.pk-ad-tip{margin-bottom:12px;background:#fffaf0;border-color:#f3d9a8}
.pk-ad-tipline{margin-top:6px}
.pk-ad-sec{margin-bottom:14px}
.pk-ad-sec h3{margin:0 0 8px;font-size:15px}
.pk-ad-mt{margin-top:10px}
.pk-ad-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.pk-ad-cols .pk-ad-sec{margin-bottom:0}
.pk-ad-cols .pk-input{width:100%}
.pk-ad-danger{border-color:#f0c4c4}
.pk-ad-data{max-width:900px}
/* 表单 */
.pk-ad-form{display:flex;flex-direction:column;gap:12px}
.pk-ad-frow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:start}
.pk-ad-flabel{padding-top:5px;color:#555;text-align:right}
.pk-ad-fctl .pk-input,.pk-ad-fctl .pk-select{width:100%}
.pk-ad-fctl input[type=color].pk-input{width:60px;height:32px;padding:2px}
.pk-ad-hint{font-size:12px;color:var(--pk-muted);margin-top:4px}
.pk-ad-radio{display:block;padding:3px 0;cursor:pointer}
.pk-ad-checks{max-height:260px;overflow:auto;border:1px solid var(--pk-line);border-radius:6px;padding:6px 10px}
.pk-ad-check{display:inline-flex;align-items:center;gap:4px;padding:3px 12px 3px 0;cursor:pointer}
.pk-ad-checks .pk-ad-check{display:flex}
.pk-ad-err{color:var(--pk-danger);min-height:1em;font-size:13px}
.pk-ad-confirm p{margin:0 0 8px}
.pk-ad-warn{color:#a66d12;font-weight:600}
.pk-ad-ok{color:var(--pk-ok)}
.pk-ad-conf{margin:4px 0 8px;padding-left:20px;max-height:220px;overflow:auto;font-size:13px}
@media (max-width:760px){
  .pk-ad-layout{grid-template-columns:1fr}
  .pk-ad-nav{flex-direction:row;flex-wrap:wrap;position:static}
  .pk-ad-frow{grid-template-columns:1fr}
  .pk-ad-flabel{text-align:left;padding-top:0}
  .pk-ad-wide{min-width:0;width:100%}
  .pk-ad-table{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<header class="pk-header">
  <div class="pk-brand">排课系统 <span id="pk-title"></span></div>
  <nav class="pk-tabs" id="pk-tabs"></nav>
</header>
<main id="pk-main"></main>

          return '<option value="' + esc(c.id) + '"' + (c.id === ui.classId ? ' selected' : '') + '>' + esc(c.name) + '</option>';
        }).join('') + '</select></label>';
    } else if (ui.mode === 'teacher') {
      h += '<label class="pk-tt-pick">老师 <select class="pk-select" data-act="pick-teacher">' +
        sortedTeachers(s).map(function (t) {
          return '<option value="' + esc(t.id) + '"' + (t.id === ui.teacherId ? ' selected' : '') + '>' + esc(t.name) + '</option>';
        }).join('') + '</select></label>';
    }
    h += '<span class="pk-tt-sp"></span>' +
      '<button class="pk-btn" data-act="undo" title="撤销（Ctrl+Z）"' + (Store.canUndo() ? '' : ' disabled') + '>↶ 撤销</button>' +
      '<button class="pk-btn" data-act="redo" title="重做（Ctrl+Shift+Z / Ctrl+Y）"' + (Store.canRedo() ? '' : ' disabled') + '>↷ 重做</button>' +
      '<button class="pk-btn pk-btn-primary" data-act="auto">⚙ 自动排课</button>' +
      '<button class="pk-btn" data-act="print">🖨 打印</button>';
    bar.innerHTML = h;

    bar.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b || b.disabled) return;
      var mode = b.getAttribute('data-mode');
      if (mode) { ui.mode = mode; saveUi(); App.refresh(); return; }
      var act = b.getAttribute('data-act');
      if (act === 'undo') doUndo();
      else if (act === 'redo') doRedo();
      else if (act === 'auto') openAutoDialog();
      else if (act === 'print') window.print();
    });
    bar.addEventListener('change', function (e) {
      var act = e.target.getAttribute('data-act');
      if (act === 'pick-class') { ui.classId = e.target.value; saveUi(); App.refresh(); }
      if (act === 'pick-teacher') { ui.teacherId = e.target.value; saveUi(); App.refresh(); }
    });
    return bar;
  }

  // 一个格子的课程块
  function lessonBlock(M, l, conf, mainText, subText) {
    var color = colorOf(M, l.subjectId);
    return '<div class="pk-lesson' + (conf ? ' pk-conf' : '') + '" style="background:' + rgba(color, 0.16) +
      ';border-left-color:' + esc(color) + '">' +
      '<div class="pk-l-main">' + (conf ? '<span class="pk-warn-ic" title="有冲突">⚠</span>' : '') + esc(mainText) +
      (l.locked ? '<span class="pk-lock" title="已锁定">🔒</span>' : '') + '</div>' +
      '<div class="pk-l-sub">' + (subText ? esc(subText) : '<span class="pk-muted">（未定老师）</span>') + '</div></div>';
  }

  function isHl(classId, d, p) {
    return highlight && highlight.classId === classId && highlight.day === d && highlight.period === p;
  }

  function buildClassView(s, M) {
    var wrap = document.createElement('div');
    wrap.className = 'pk-tt-layout';
    var idx = lessonIndex(s), cset = conflictSet();
    var cls = M.cls[ui.classId];
    var days = s.settings.days, periods = s.settings.periods;

    var h = '<div class="pk-tt-mainpane"><h2 class="pk-tt-title">' + esc(titleText(s, cls.name + '课表')) + '</h2>' +
      '<div class="pk-tt-scroll" data-sk="class"><table class="pk-grid pk-grid-class"><thead><tr><th class="pk-g-corner">节次</th>' +
      days.map(function (d) { return '<th>' + esc(d) + '</th>'; }).join('') + '</tr></thead><tbody>';
    periods.forEach(function (pn, p) {
      h += '<tr><th class="pk-g-period">' + esc(pn) + '</th>';
      days.forEach(function (dn, d) {
        var l = idx[cls.id + '|' + d + '|' + p];
        h += cellTd(M, cls.id, d, p, l, cset, false);
      });
      h += '</tr>';
      breaksAfter(s, p).forEach(function (b) {
        h += '<tr class="pk-break"><td colspan="' + (days.length + 1) + '">' + esc(b.label) + '</td></tr>';
      });
    });
    h += '</tbody></table></div>' +
      '<p class="pk-muted pk-noprint pk-tt-tip">提示：点格子可以编辑；按住格子拖到别的格子可以移动或互换；⚠ 表示老师时间冲突；🔒 表示已锁定（自动排课不会动它）。</p></div>';

    // 侧栏：教学任务完成度
    var pm = placedMap();
    var plans = s.plans.filter(function (x) { return x.classId === cls.id; }).map(function (x) {
      return { plan: x, placed: pm[x.id] || 0 };
    });
    plans.sort(function (a, b) {
      var ra = a.placed < a.plan.hours ? 0 : (a.placed > a.plan.hours ? 1 : 2);
      var rb = b.placed < b.plan.hours ? 0 : (b.placed > b.plan.hours ? 1 : 2);
      return ra - rb || String(subjName(M, a.plan.subjectId)).localeCompare(subjName(M, b.plan.subjectId), 'zh-CN');
    });
    var need = 0, got = 0;
    plans.forEach(function (x) { need += Number(x.plan.hours) || 0; got += x.placed; });
    var classTotal = s.lessons.filter(function (l) { return l.classId === cls.id; }).length;
    h += '<aside class="pk-tt-side pk-noprint" data-sk="side"><div class="pk-card"><div class="pk-side-h">本班教学任务</div>' +
      '<div class="pk-muted pk-side-sum">课表共 ' + classTotal + ' 节；任务应排 ' + need + ' 节，已排 ' + got + ' 节</div>';
    if (!plans.length) h += '<div class="pk-muted">本班还没有教学任务，可在「基础数据 → 教学任务」中添加。</div>';
    plans.forEach(function (x) {
      var p = x.plan, color = colorOf(M, p.subjectId);
      var under = x.placed < p.hours, over = x.placed > p.hours;
      var badge = under ? '<span class="pk-badge pk-badge-warn">差 ' + (p.hours - x.placed) + '</span>' :
        over ? '<span class="pk-badge pk-badge-err">多 ' + (x.placed - p.hours) + '</span>' : '<span class="pk-badge pk-badge-ok">✓</span>';
      h += '<div class="pk-plan' + (under ? ' pk-plan-drag' : '') + '"' + (under ? ' draggable="true" data-plan="' + esc(p.id) + '" title="拖到左边的空格子里"' : '') +
        ' style="border-left-color:' + esc(color) + ';background:' + rgba(color, 0.10) + '">' +
        '<div class="pk-plan-name">' + (under ? '<span class="pk-grip">⠿</span>' : '') + esc(subjName(M, p.subjectId)) +
        ' <span class="pk-muted">' + esc(teachName(M, p.teacherId) || '未定老师') + '</span></div>' +
        '<div class="pk-plan-num">' + x.placed + ' / ' + p.hours + ' ' + badge + '</div></div>';
    });
    if (plans.some(function (x) { return x.placed < x.plan.hours; })) h += '<div class="pk-muted pk-side-tip">把带 ⠿ 的任务拖到左边空格子里即可排课。</div>';
    h += '</div></aside>';
    wrap.innerHTML = h;
    bindGrid(wrap);
    return wrap;
  }

  function cellTd(M, classId, d, p, l, cset, compact) {
    var conf = l && cset[l.id];
    var cls = 'pk-cell' + (l ? '' : ' pk-cell-empty') + (conf ? ' pk-cell-conf' : '') + (l && l.locked ? ' pk-cell-locked' : '') + (isHl(classId, d, p) ? ' pk-hl' : '');
    var attrs = ' data-c="' + esc(classId) + '" data-d="' + d + '" data-p="' + p + '"' + (l && !l.locked ? ' draggable="true"' : '');
    var tip = l ? subjName(M, l.subjectId) + (l.teacherId ? '（' + teachName(M, l.teacherId) + '）' : '') + (l.locked ? ' 已锁定' : '') : '空，点击排课';
    var inner = '';
    if (l) {
      if (compact) {
        var color = colorOf(M, l.subjectId);
        inner = '<div class="pk-lesson pk-lesson-c' + (conf ? ' pk-conf' : '') + '" style="background:' + rgba(color, 0.16) + ';border-left-color:' + esc(color) + '">' +
          '<div class="pk-l-main">' + (conf ? '<span class="pk-warn-ic">⚠</span>' : '') + esc(subjName(M, l.subjectId)) + (l.locked ? '<span class="pk-lock">🔒</span>' : '') + '</div>' +
          '<div class="pk-l-sub">' + esc(teachName(M, l.teacherId)) + '</div></div>';
      } else inner = lessonBlock(M, l, conf, subjName(M, l.subjectId), teachName(M, l.teacherId));
    } else inner = '<div class="pk-empty-mark">＋</div>';
    return '<td class="' + cls + '"' + attrs + ' title="' + esc(tip) + '">' + inner + '</td>';
  }

  function buildAllView(s, M) {
    var wrap = document.createElement('div');
    var idx = lessonIndex(s), cset = conflictSet();
    var cls = sortedClasses(s), days = s.settings.days, periods = s.settings.periods;
    var h = '<h2 class="pk-tt-title">' + esc(titleText(s, '全校总课表')) + '</h2>' +
      '<div class="pk-tt-scroll" data-sk="all"><table class="pk-grid pk-grid-all" style="--pk-cols:' + cls.length + '"><thead><tr><th>星期</th><th>节次</th>' +
      cls.map(function (c) { return '<th>' + esc(c.name) + '</th>'; }).join('') + '</tr></thead><tbody>';
    days.forEach(function (dn, d) {
      periods.forEach(function (pn, p) {
        h += '<tr' + (p === 0 ? ' class="pk-day-start"' : '') + '>';
        if (p === 0) h += '<th class="pk-g-day" rowspan="' + periods.length + '">' + esc(dn) + '</th>';
        h += '<th class="pk-g-period">' + esc(pn) + '</th>';
        cls.forEach(function (c) { h += cellTd(M, c.id, d, p, idx[c.id + '|' + d + '|' + p], cset, true); });
        h += '</tr>';
      });
    });
    h += '</tbody></table></div><p class="pk-muted pk-noprint pk-tt-tip">点格子可编辑，格子之间可拖动（含跨班级）。红框 ⚠ 为老师时间冲突。</p>';
    wrap.innerHTML = h;
    bindGrid(wrap);
    return wrap;
  }

  function buildTeacherView(s, M) {
    var wrap = document.createElement('div');
    var t = M.teach[ui.teacherId];
    if (!t) { wrap.className = 'pk-card'; wrap.textContent = '还没有老师。'; return wrap; }
    var days = s.settings.days, periods = s.settings.periods;
    var mine = (Store.teacherLessons(t.id) || []);
    var slot = {}, byClass = {};
    mine.forEach(function (l) {
      var k = l.day + '|' + l.period;
      (slot[k] = slot[k] || []).push(l);
      byClass[l.classId] = (byClass[l.classId] || 0) + 1;
    });
    var cset = conflictSet();
    var h = '<h2 class="pk-tt-title">' + esc(titleText(s, t.name + '老师课表')) + '</h2>' +
      '<div class="pk-tt-scroll" data-sk="teacher"><table class="pk-grid pk-grid-class"><thead><tr><th class="pk-g-corner">节次</th>' +
      days.map(function (d) { return '<th>' + esc(d) + '</th>'; }).join('') + '</tr></thead><tbody>';
    periods.forEach(function (pn, p) {
      h += '<tr><th class="pk-g-period">' + esc(pn) + '</th>';
      days.forEach(function (dn, d) {
        var list = slot[d + '|' + p] || [];
        var conf = list.length > 1 || list.some(function (l) { return cset[l.id]; });
        h += '<td class="pk-cell pk-cell-t' + (list.length ? '' : ' pk-cell-empty') + (conf ? ' pk-cell-conf' : '') + '">';
        list.forEach(function (l) {
          h += '<div class="pk-t-item" data-c="' + esc(l.classId) + '" data-d="' + d + '" data-p="' + p + '" title="点击编辑">' +
            lessonBlock(M, l, conf, clsName(M, l.classId) + '·' + subjName(M, l.subjectId), null).replace('<span class="pk-muted">（未定老师）</span>', '') + '</div>';
        });
        h += '</td>';
      });
      h += '</tr>';
      breaksAfter(s, p).forEach(function (b) {
        h += '<tr class="pk-break"><td colspan="' + (days.length + 1) + '">' + esc(b.label) + '</td></tr>';
      });
    });
    var detail = sortedClasses(s).filter(function (c) { return byClass[c.id]; }).map(function (c) { return c.name + ' ' + byClass[c.id] + ' 节'; }).join('、');
    h += '</tbody><tfoot><tr><td colspan="' + (days.length + 1) + '" class="pk-t-total">周课时合计：<b>' + mine.length + '</b> 节' +
      (detail ? '（' + esc(detail) + '）' : '') + '</td></tr></tfoot></table></div>' +
      '<p class="pk-muted pk-noprint pk-tt-tip">点击课程可修改该班这一节课。</p>';
    wrap.innerHTML = h;
    wrap.addEventListener('click', function (e) {
      var it = e.target.closest('[data-c]');
      if (it) openEditor(it.getAttribute('data-c'), +it.getAttribute('data-d'), +it.getAttribute('data-p'));
    });
    return wrap;
  }

  /* ---------- 拖拽 ---------- */
  function cellPos(td) { return { classId: td.getAttribute('data-c'), day: +td.getAttribute('data-d'), period: +td.getAttribute('data-p') }; }

  function judge(t) {
    var key = t.classId + '|' + t.day + '|' + t.period;
    if (judgeCache[key]) return judgeCache[key];
    var r = { invalid: false, conflicts: [], msg: '' };
    var tl = Store.lessonAt(t.classId, t.day, t.period);
    if (!drag) r.invalid = true;
    else if (tl && tl.locked) { r.invalid = true; r.msg = '目标格已锁定'; }
    else if (drag.kind === 'cell') {
      var src = Store.lessonAt(drag.classId, drag.day, drag.period);
      if (!src || (drag.classId === t.classId && drag.day === t.day && drag.period === t.period)) r.invalid = true;
      else {
        if (src.teacherId) r.conflicts = (Store.checkPlacement(t.classId, t.day, t.period, src.teacherId) || [])
          .filter(function (l) { return l.id !== src.id; });
        if (tl && tl.teacherId) r.conflicts = r.conflicts.concat((Store.checkPlacement(drag.classId, drag.day, drag.period, tl.teacherId) || [])
          .filter(function (l) { return l.id !== tl.id; }));
      }
    } else {
      var plan = Store.lookup('plans', drag.planId);
      if (!plan) r.invalid = true;
      else if (tl) { r.invalid = true; r.msg = '该格已有课，请拖到空格子'; }
      else if (plan.classId !== t.classId) { r.invalid = true; r.msg = '只能放进本班的格子'; }
      else if (plan.teacherId) r.conflicts = Store.checkPlacement(t.classId, t.day, t.period, plan.teacherId) || [];
    }
    judgeCache[key] = r;
    return r;
  }

  function clearDropMarks() {
    document.querySelectorAll('.pk-drop-ok,.pk-drop-bad,.pk-drop-no,.pk-dragging').forEach(function (x) {
      x.classList.remove('pk-drop-ok', 'pk-drop-bad', 'pk-drop-no', 'pk-dragging');
    });
  }

  function bindGrid(root) {
    root.addEventListener('click', function (e) {
      var td = e.target.closest('td[data-c]');
      if (td) { var p = cellPos(td); openEditor(p.classId, p.day, p.period); }
    });
    root.addEventListener('dragstart', function (e) {
      var pl = e.target.closest && e.target.closest('[data-plan]');
      var td = e.target.closest && e.target.closest('td[data-c]');
      if (pl) { drag = { kind: 'plan', planId: pl.getAttribute('data-plan') }; pl.classList.add('pk-dragging'); }
      else if (td) { drag = Object.assign({ kind: 'cell' }, cellPos(td)); td.classList.add('pk-dragging'); }
      else return;
      judgeCache = {};
      try { e.dataTransfer.setData('text/plain', 'paike'); e.dataTransfer.effectAllowed = drag.kind === 'plan' ? 'copy' : 'move'; } catch (err) { /* 忽略 */ }
    });
    root.addEventListener('dragover', function (e) {
      var td = e.target.closest('td[data-c]');
      if (!td || !drag) return;
      var r = judge(cellPos(td));
      td.classList.remove('pk-drop-ok', 'pk-drop-bad', 'pk-drop-no');
      if (r.invalid) { td.classList.add('pk-drop-no'); return; }
      e.preventDefault();
      try { e.dataTransfer.dropEffect = drag.kind === 'plan' ? 'copy' : 'move'; } catch (err) { /* 忽略 */ }
      td.classList.add(r.conflicts.length ? 'pk-drop-bad' : 'pk-drop-ok');
    });
    root.addEventListener('dragleave', function (e) {
      var td = e.target.closest('td[data-c]');
      if (td && !td.contains(e.relatedTarget)) td.classList.remove('pk-drop-ok', 'pk-drop-bad', 'pk-drop-no');
    });
    root.addEventListener('drop', function (e) {
      var td = e.target.closest('td[data-c]');
      if (!td || !drag) return;
      e.preventDefault();
      var t = cellPos(td), r = judge(t), d = drag;
      drag = null; judgeCache = {};
      clearDropMarks();
      if (r.invalid) { if (r.msg) App.toast(r.msg, 'warn'); return; }
      var M = maps(st());
      if (d.kind === 'cell') Store.moveLesson({ classId: d.classId, day: d.day, period: d.period }, t);
      else {
        var plan = Store.lookup('plans', d.planId);
        Store.setLesson(t.classId, t.day, t.period, { subjectId: plan.subjectId, teacherId: plan.teacherId || null });
      }
      if (r.conflicts.length) App.toast('已放入，但有冲突：' + describeConflicts(M, r.conflicts), 'warn');
    });
    root.addEventListener('dragend', function () { drag = null; judgeCache = {}; clearDropMarks(); });
  }

  /* ---------- 编辑格子 ---------- */
  function openEditor(classId, day, period) {
    var s = st(), M = maps(s);
    var lesson = Store.lessonAt(classId, day, period);
    var locked = !!(lesson && lesson.locked);
    var pm = placedMap();
    var body = document.createElement('div');
    body.className = 'pk-ed';

    var h = '<div class="pk-ed-where"><b>' + esc(clsName(M, classId)) + '</b> · ' + esc(slotName(day, period)) +
      (lesson ? '　当前：<b>' + esc(subjName(M, lesson.subjectId)) + '</b>' + (lesson.teacherId ? '（' + esc(teachName(M, lesson.teacherId)) + '）' : '') : '　当前：空') +
      (locked ? ' 🔒' : '') + '</div>';
    if (locked) h += '<div class="pk-ed-lockmsg">这节课已锁定。如需修改或清空，请先点下方「解锁」。</div>';

    var sugg = [];
    try { sugg = (window.Scheduler && Scheduler.suggest) ? (Scheduler.suggest(classId, day, period) || []) : []; } catch (e) { console.error(e); }
    h += '<div class="pk-ed-sec">本班教学任务（点一下直接排入）</div><div class="pk-ed-quick">';
    if (!sugg.length) h += '<div class="pk-muted">没有可选的教学任务。</div>';
    sugg.forEach(function (x, i) {
      var p = x.plan, color = colorOf(M, p.subjectId), placed = pm[p.id] || 0;
      h += '<button class="pk-ed-q' + (x.ok ? '' : ' pk-ed-q-bad') + '" data-i="' + i + '"' + (locked ? ' disabled' : '') +
        ' style="border-left-color:' + esc(color) + ';background:' + rgba(color, 0.10) + '">' +
        '<span class="pk-ed-q-name">' + esc(subjName(M, p.subjectId)) + ' <span class="pk-muted">' + esc(teachName(M, p.teacherId) || '未定老师') + '</span></span>' +
        '<span class="pk-ed-q-num">已排 ' + placed + ' / 应排 ' + p.hours + '</span>' +
        (x.ok ? '<span class="pk-badge pk-badge-ok">可排</span>' : '<span class="pk-badge pk-badge-err">⚠ 冲突</span>') +
        (x.reason ? '<span class="pk-ed-q-why' + (x.ok ? '' : ' pk-ed-q-whybad') + '">' + esc(x.reason) + '</span>' : '') +
        '</button>';
    });
    h += '</div>';

    h += '<div class="pk-ed-sec">或者手动选择</div><div class="pk-ed-manual">' +
      '<label>科目 <select class="pk-select" data-f="subj"' + (locked ? ' disabled' : '') + '><option value="">（请选择）</option>' +
      s.subjects.map(function (x) { return '<option value="' + esc(x.id) + '"' + (lesson && lesson.subjectId === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') +
      '</select></label>' +
      '<label>老师 <select class="pk-select" data-f="teacher"' + (locked ? ' disabled' : '') + '><option value="">（暂不指定）</option>' +
      sortedTeachers(s).map(function (x) { return '<option value="' + esc(x.id) + '"' + (lesson && lesson.teacherId === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') +
      '</select></label></div><div class="pk-ed-hint"></div>';
    body.innerHTML = h;

    var selS = body.querySelector('[data-f=subj]'), selT = body.querySelector('[data-f=teacher]'), hint = body.querySelector('.pk-ed-hint');
    function updateHint() {
      var tid = selT.value, sid = selS.value, out = [];
      if (tid) {
        var conf = Store.checkPlacement(classId, day, period, tid) || [];
        if (conf.length) out.push('<div class="pk-ed-bad">⚠ 冲突：' + esc(describeConflicts(M, conf)) + '</div>');
        else out.push('<div class="pk-ed-ok">✓ ' + esc(teachName(M, tid)) + '老师这个时间没有别的课</div>');
      }
      if (sid) {
        var plan = s.plans.filter(function (p) { return p.classId === classId && p.subjectId === sid && (!tid || p.teacherId === tid); })[0];
        if (plan && (!tid || plan.teacherId === tid)) out.push('<div class="pk-muted">该教学任务已排 ' + (pm[plan.id] || 0) + ' / 应排 ' + plan.hours + ' 节</div>');
        else out.push('<div class="pk-muted">提示：本班教学任务里没有这一项（仍可保存）</div>');
      }
      hint.innerHTML = out.join('');
    }
    selS.addEventListener('change', function () {
      var plan = s.plans.filter(function (p) { return p.classId === classId && p.subjectId === selS.value; })[0];
      if (plan && plan.teacherId) selT.value = plan.teacherId;
      updateHint();
    });
    selT.addEventListener('change', updateHint);
    updateHint();

    var buttons = [];
    if (lesson) {
      buttons.push({ text: '清空', danger: true, onClick: function () {
        if (locked) { App.toast('已锁定，请先解锁', 'warn'); return false; }
        Store.clearLesson(classId, day, period); App.toast('已清空', 'ok');
      } });
      buttons.push({ text: locked ? '解锁' : '锁定', onClick: function () {

  /** 收集把一组课改给 teacherId 后会产生的冲突 */
  function collectConflicts(lessons, teacherId) {
    if (!teacherId) return [];
    var out = [], seen = {};
    lessons.forEach(function (l) {
      var arr = [];
      try { arr = Store.checkPlacement(l.classId, l.day, l.period, teacherId) || []; } catch (e) { arr = []; }
      arr.forEach(function (c) {
        if (seen[l.id + '|' + c.id]) return;
        seen[l.id + '|' + c.id] = 1;
        out.push({ lesson: l, other: c });
      });
    });
    return out;

  function charSim(a, b) {
    var A = {}, B = {}, inter = 0, uni = 0;
    String(a).replace(/[\s·/／、与和及]/g, '').split('').forEach(function (ch) { A[ch] = 1; });
    String(b).replace(/[\s·/／、与和及]/g, '').split('').forEach(function (ch) { B[ch] = 1; });
    Object.keys(A).forEach(function (k) { uni++; if (B[k]) inter++; });
    Object.keys(B).forEach(function (k) { if (!A[k]) uni++; });
    return uni ? inter / uni : 0;
  }
  function similarSubjects() {
    var subs = S().subjects, groups = [], used = {};
    for (var i = 0; i < subs.length; i++) {
      if (used[subs[i].id]) continue;
      var g = [subs[i]];
      for (var j = i + 1; j < subs.length; j++) {
        if (used[subs[j].id]) continue;
        var a = subs[i].name, b = subs[j].name;
        if (Math.min(a.length, b.length) >= 3 && charSim(a, b) >= 0.7) { g.push(subs[j]); used[subs[j].id] = 1; }
      }
      if (g.length > 1) { used[subs[i].id] = 1; groups.push(g); }
    }
    return groups;
  }

  function mergeSubject(id) {

    // 默认目标：名称最相近的科目

    var st = S();

  function doMergeSubject(a, b) {
    var st = S();
    var plansA = st.plans.filter(function (p) { return p.subjectId === a.id; }).map(function (p) { return { id: p.id, classId: p.classId, teacherId: p.teacherId || null, hours: Number(p.hours) || 0 }; });
    var bMap = {};
    st.plans.forEach(function (p) { if (p.subjectId === b.id) bMap[p.classId + '|' + (p.teacherId || '')] = { id: p.id, hours: Number(p.hours) || 0 }; });
    var lessonIds = st.lessons.filter(function (l) { return l.subjectId === a.id; }).map(function (l) { return l.id; });
    Store.transaction(function () {
      plansA.forEach(function (p) {
        var k = p.classId + '|' + (p.teacherId || ''), dup = bMap[k];
        if (dup) { dup.hours += p.hours; Store.update('plans', dup.id, { hours: dup.hours }); Store.remove('plans', p.id); }
        else { Store.update('plans', p.id, { subjectId: b.id }); bMap[k] = { id: p.id, hours: p.hours }; }
      });
      lessonIds.forEach(function (lid) { Store.update('lessons', lid, { subjectId: b.id }); });
      Store.remove('subjects', a.id);
    });
  }

  function teacherPairs(tid) {
    var st = S(), map = {}, list = [];
    function get(cid, sid) {
      var k = cid + '|' + sid;
      if (!map[k]) { map[k] = { classId: cid, subjectId: sid, plans: [], lessons: [] }; list.push(map[k]); }
      return map[k];
    }
    st.plans.forEach(function (p) { if (p.teacherId === tid) get(p.classId, p.subjectId).plans.push(p); });
    st.lessons.forEach(function (l) { if (l.teacherId === tid) get(l.classId, l.subjectId).lessons.push(l); });
    var cr = classRank(), sr = subjectRank();
    list.sort(function (x, y) { return (cr[x.classId] || 0) - (cr[y.classId] || 0) || (sr[x.subjectId] || 0) - (sr[y.subjectId] || 0); });
    return list;
  }

  function swapTeacher(fromId) {
    var from = find('teachers', fromId); if (!from) return;
    var pairs = teacherPairs(fromId);
    if (!pairs.length) return App.toast('该老师没有教学任务或已排课', 'warn');
    var tOpts = [['', '— 请选择 —']].concat(S().teachers.filter(function (t) { return t.id !== fromId; }).map(function (t) { return [t.id, t.name]; }))
      .concat([['__new__', '＋ 新老师（输入姓名）']]);
    formModal('换老师：' + from.name, [
      { key: 'pairs', label: '要转交的', type: 'checks', options: pairs.map(function (p, i) {
        var hrs = p.plans.reduce(function (s, x) { return s + (Number(x.hours) || 0); }, 0);
        return [String(i), esc(nameOf('classes', p.classId)) + ' · ' + esc(nameOf('subjects', p.subjectId)) +
          ' <span class="pk-muted">（计划 ' + hrs + ' 节，已排 ' + p.lessons.length + ' 节）</span>'];
      }) },
      { key: 'to', label: '转给', type: 'select', value: '', options: tOpts },
      { key: 'newName', label: '新老师姓名', value: '', show: function (v) { return v.to === '__new__'; } }
    ], '下一步', function (v, err) {
      var sel = v.pairs.map(function (i) { return pairs[Number(i)]; });
      if (!sel.length) return err('请至少勾选一项');
      if (!v.to) return err('请选择接任的老师');
      var newName = null, toId = v.to;
      if (toId === '__new__') {
        newName = trimName(v.newName);
        if (!newName) return err('请输入新老师姓名');
        if (dupName('teachers', newName)) return err('已有老师「' + newName + '」，请直接在列表中选择');
        toId = null;
      }
      var lessons = [], plans = [];
      sel.forEach(function (p) { lessons = lessons.concat(p.lessons); plans = plans.concat(p.plans); });
      var conf = toId ? collectConflicts(lessons, toId) : [];
      var toName = newName || nameOf('teachers', toId);
      setTimeout(function () {
        var html = '<p>将把「<b>' + esc(from.name) + '</b>」的 <b>' + plans.length + '</b> 条教学任务、<b>' + lessons.length + '</b> 节已排课转给「<b>' + esc(toName) + '</b>」' +
          (newName ? '（新建老师）' : '') + '：</p><p class="pk-muted">' + sel.map(function (p) { return esc(nameOf('classes', p.classId) + ' ' + nameOf('subjects', p.subjectId)); }).join('、') + '</p>';
        if (conf.length) html += '<p class="pk-ad-warn">⚠ 发现 ' + conf.length + ' 处时间冲突（' + esc(toName) + ' 同一时间已有课）：</p>' + conflictListHtml(conf, toId) +
          '<p class="pk-muted">仍可转交，之后在「检查」页处理冲突。</p>';
        else html += '<p class="pk-ad-ok">✓ 没有时间冲突。</p>';
        confirmBox('确认换老师', html, conf.length ? '仍然转交' : '确定转交', function () {
          doSwap(plans, lessons, toId, newName);
          App.toast('已转交给「' + toName + '」：' + lessons.length + ' 节课' + (conf.length ? '，有 ' + conf.length + ' 处冲突待处理' : ''), conf.length ? 'warn' : 'ok');
        });
      }, 0);
      return true;
    });
  }
  function doSwap(plans, lessons, toId, newName) {
    var st = S();
    var tMap = {};
    if (toId) st.plans.forEach(function (p) { if (p.teacherId === toId) tMap[p.classId + '|' + p.subjectId] = { id: p.id, hours: Number(p.hours) || 0 }; });
    var pl = plans.map(function (p) { return { id: p.id, classId: p.classId, subjectId: p.subjectId, hours: Number(p.hours) || 0 }; });
    var lids = lessons.map(function (l) { return l.id; });
    Store.transaction(function () {
      if (!toId) {
        var nt = Store.add('teachers', { id: newId('t'), name: newName, note: '' });
        toId = (nt && nt.id) || (S().teachers.filter(function (t) { return t.name === newName; })[0] || {}).id;
      }
      pl.forEach(function (p) {
        var k = p.classId + '|' + p.subjectId, dup = tMap[k];
        if (dup) { dup.hours += p.hours; Store.update('plans', dup.id, { hours: dup.hours }); Store.remove('plans', p.id); }
        else { Store.update('plans', p.id, { teacherId: toId }); tMap[k] = { id: p.id, hours: p.hours }; }
      });
      lids.forEach(function (id) { Store.update('lessons', id, { teacherId: toId }); });
    });
  }

      });

    }

  function changePlanTeacher(planId, newT) {
    var st = S(), p = find('plans', planId); if (!p) return;
    var oldT = p.teacherId || null;
    if (oldT === newT) return;
    var lessons = st.lessons.filter(function (l) { return l.classId === p.classId && l.subjectId === p.subjectId && (l.teacherId || null) === oldT; });
    var dup = st.plans.filter(function (q) { return q.id !== p.id && q.classId === p.classId && q.subjectId === p.subjectId && (q.teacherId || null) === newT; })[0];
    var conf = collectConflicts(lessons, newT);
    var label = nameOf('classes', p.classId) + ' ' + nameOf('subjects', p.subjectId);
    var lids = lessons.map(function (l) { return l.id; }), hours = Number(p.hours) || 0;
    function apply() {
      Store.transaction(function () {
        if (dup) { Store.update('plans', dup.id, { hours: (Number(dup.hours) || 0) + hours }); Store.remove('plans', p.id); }
        else Store.update('plans', p.id, { teacherId: newT });
        lids.forEach(function (id) { Store.update('lessons', id, { teacherId: newT }); });
      });
      App.toast(label + ' 改由「' + tName(newT) + '」任教' + (lids.length ? '，已同步 ' + lids.length + ' 节课' : '') +
        (conf.length ? '，有 ' + conf.length + ' 处冲突' : ''), conf.length ? 'warn' : 'ok');
    }
    if (!conf.length) return apply();
    App.refresh(); // 先恢复下拉框显示，取消时不残留
    confirmBox('老师时间冲突', '<p>把 <b>' + esc(label) + '</b> 改为「<b>' + esc(tName(newT)) + '</b>」后，以下时间会冲突：</p>' + conflictListHtml(conf, newT) +
      '<p class="pk-muted">仍可更换，之后在「检查」页或课表中调整。</p>', '仍然更换', apply);
  }

  function regenPlans() {
    var st = S();
    var cids = ui.planClass ? [ui.planClass] : st.classes.map(function (c) { return c.id; });
    var inScope = {}; cids.forEach(function (c) { inScope[c] = 1; });
    var groups = {}, order = [];
    st.lessons.forEach(function (l) {
      if (!inScope[l.classId] || !l.subjectId) return;
      var k = l.classId + '|' + l.subjectId + '|' + (l.teacherId || '');
      if (!groups[k]) { groups[k] = { classId: l.classId, subjectId: l.subjectId, teacherId: l.teacherId || null, hours: 0 }; order.push(k); }
      groups[k].hours++;
    });
    var old = st.plans.filter(function (p) { return inScope[p.classId]; }).map(function (p) { return p.id; });
    var scopeName = ui.planClass ? '「' + nameOf('classes', ui.planClass) + '」' : '全部 ' + cids.length + ' 个班';
    confirmBox('按当前课表重新生成教学任务', '<p>将删除' + esc(scopeName) + '现有的 <b>' + old.length + '</b> 条教学任务，按课表中实际已排的课重新生成 <b>' + order.length +

    r.onload = function () {
      var obj;
      try { obj = JSON.parse(String(r.result).replace(/^﻿/, '')); } catch (e) { return App.toast('文件不是有效的备份（JSON 格式错误）', 'err'); }
      var v = validateState(obj);
      if (!v.ok) {
        return App.modal({ title: '无法导入', body: '<p>「' + esc(file.name) + '」不是有效的排课备份：</p><ul>' + v.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' });
      }
      confirmBox('导入备份', '<p>文件：<b>' + esc(file.name) + '</b></p><p>内容：' + esc((v.state.meta.title || '') + ' ' + summary(v.state)) + '</p>' +
        (v.warnings.length ? '<p class="pk-ad-warn">⚠ ' + v.warnings.map(esc).join('；') + '</p>' : '') +
        '<p>导入将<b>替换当前全部数据</b>（可在「课表」页撤销）。建议先「导出备份」或「保存为方案」。</p>', '导入并替换', function () {
        try { Store.replaceAll(v.state); App.toast('已导入备份：' + summary(v.state), 'ok'); }
        catch (e) { App.toast('导入失败：' + e.message, 'err'); }
      }, true);
    };
    r.readAsText(file, 'utf-8');
  }

  function render(el) {
    var st = Store.get(), snaps = getSnaps();
    var h = '<div class="pk-ad pk-ad-data">';
    h += '<div class="pk-card pk-ad-sec"><h3>导出课表</h3><div class="pk-muted pk-ad-desc">Excel 文件（.xls）可直接用 Excel 或 WPS 打开、打印，版式与原课表一致。</div>' +
      '<div class="pk-row pk-ad-mt">' +
      '<label class="pk-ad-check"><input type="checkbox" data-opt="xlsClasses"' + (ui.xlsClasses ? ' checked' : '') + '> 每班一张（' + st.classes.length + ' 张）</label>' +
      '<label class="pk-ad-check"><input type="checkbox" data-opt="xlsTeachers"' + (ui.xlsTeachers ? ' checked' : '') + '> 每位老师一张（' + st.teachers.length + ' 张）</label>' +
      '<label class="pk-ad-check"><input type="checkbox" data-opt="xlsSummary"' + (ui.xlsSummary ? ' checked' : '') + '> 总表一张</label></div>' +
      '<div class="pk-row pk-ad-mt"><button class="pk-btn pk-btn-primary" data-act="xls">导出 Excel</button>' +
      '<button class="pk-btn" data-act="csv">导出 CSV（明细）</button></div></div>';

    h += '<div class="pk-card pk-ad-sec"><h3>方案快照</h3><div class="pk-muted pk-ad-desc">把当前课表存为一个「方案」，可以放心尝试调整，不满意再恢复。方案保存在本浏览器中。</div>' +
      '<div class="pk-row pk-ad-mt"><input class="pk-input pk-ad-wide" data-id="snapName" placeholder="方案名称，如：初稿、调整体育后" value="' + esc(ui.snapName) + '">' +
      '<button class="pk-btn pk-btn-primary" data-act="snapSave">保存当前为方案</button></div>';
    h += '<table class="pk-table pk-ad-table pk-ad-mt"><thead><tr><th>方案名称</th><th>保存时间</th><th class="pk-ad-w-ops1">操作</th></tr></thead><tbody>';
    if (!snaps.length) h += '<tr><td colspan="3" class="pk-muted pk-ad-empty">还没有保存方案。</td></tr>';
    snaps.forEach(function (s) {
      var t = s.time || s.savedAt || s.createdAt || s.at || s.date;
      h += '<tr><td><b>' + esc(s.name || '未命名') + '</b></td><td>' + esc(fmtTime(t)) + '</td><td class="pk-ad-nowrap">' +
        '<button class="pk-btn pk-ad-sm" data-act="snapRestore" data-id="' + esc(s.id) + '">恢复</button> ' +
        '<button class="pk-btn pk-ad-sm pk-btn-danger" data-act="snapDel" data-id="' + esc(s.id) + '">删除</button></td></tr>';
    });
    h += '</tbody></table></div>';

    h += '<div class="pk-card pk-ad-sec"><h3>备份与恢复</h3><div class="pk-muted pk-ad-desc">数据只保存在本电脑的浏览器里。换电脑、清理浏览器前，请先导出备份文件妥善保存。</div>' +
      '<div class="pk-row pk-ad-mt"><button class="pk-btn pk-btn-primary" data-act="json">导出备份文件</button>' +
      '<button class="pk-btn" data-act="import">导入备份文件…</button><input type="file" accept=".json,application/json" data-id="file" style="display:none"></div>' +
      '<div class="pk-muted pk-ad-mt">当前数据：' + esc(summary(st)) + '</div></div>';

    h += '<div class="pk-card pk-ad-sec pk-ad-danger"><h3>恢复为原始课表</h3><div class="pk-muted pk-ad-desc">丢弃所有修改，回到最初从 Excel 导入的课表（9 个班）。已保存的方案不受影响。</div>' +
      '<div class="pk-row pk-ad-mt"><button class="pk-btn pk-btn-danger" data-act="reset">恢复为原始课表…</button></div></div>';
    h += '</div>';

    var root = document.createElement('div');
    root.innerHTML = h;
    el.innerHTML = '';
    el.appendChild(root);
    var nameInput = root.querySelector('[data-id="snapName"]');
    nameInput.addEventListener('input', function () { ui.snapName = nameInput.value; });
    nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') acts.snapSave(); });
    var fileInput = root.querySelector('[data-id="file"]');
    fileInput.addEventListener('change', function () { var f = fileInput.files && fileInput.files[0]; fileInput.value = ''; importJson(f); });
    root.addEventListener('change', function (e) {
      var o = e.target.getAttribute && e.target.getAttribute('data-opt');
      if (o) ui[o] = e.target.checked;
    });

    var acts = {
      xls: function () {
        if (!ui.xlsClasses && !ui.xlsTeachers && !ui.xlsSummary) return App.toast('请至少勾选一种工作表', 'warn');
        var xml;
        try { xml = buildXls(Store.get(), { classes: ui.xlsClasses, teachers: ui.xlsTeachers, summary: ui.xlsSummary }); }
        catch (e) { console.error(e); return App.toast('生成 Excel 失败：' + e.message, 'err'); }
        if (!xml) return App.toast('没有可导出的内容', 'warn');
        var s = Store.get();
        download(xml, safeFile(s.meta && s.meta.title) + '课表_' + stamp() + '.xls', 'application/vnd.ms-excel;charset=utf-8');
      },
      csv: function () {
        var s = Store.get();
        try { download(buildCsv(s), safeFile(s.meta && s.meta.title) + '课表明细_' + stamp() + '.csv', 'text/csv;charset=utf-8'); }
        catch (e) { App.toast('导出失败：' + e.message, 'err'); }
      },
      json: exportJson,
      import: function () { fileInput.click(); },
      snapSave: function () {
        var name = String(ui.snapName || '').trim();
        if (!name) { App.toast('请先输入方案名称', 'err'); nameInput.focus(); return; }
        if (getSnaps().some(function (s) { return s.name === name; })) { App.toast('已有同名方案「' + name + '」，请换个名称', 'err'); return; }
        try {
          var r = Store.saveSnapshot(name); ui.snapName = '';
          if (r && r.persisted === false) App.toast('方案「' + name + '」已保存，但未能写入浏览器存储（空间可能已满），关闭页面后会丢失。请删除旧方案或导出备份文件。', 'err');
          else App.toast('已保存方案「' + name + '」', 'ok');
        }
        catch (e) { App.toast('保存失败：' + (e.message || e) + '（浏览器存储空间可能已满，可删除旧方案）', 'err'); }
        App.refresh();
      },
      snapRestore: function (id) {
        var s = getSnaps().filter(function (x) { return x.id === id; })[0]; if (!s) return;
        confirmBox('恢复方案', '<p>确定恢复为方案「<b>' + esc(s.name) + '</b>」吗？</p><p>当前课表将被替换（可在「课表」页撤销）。如需保留当前课表，请先保存为方案。</p>', '恢复', function () {
          try { Store.restoreSnapshot(id); App.toast('已恢复方案「' + s.name + '」', 'ok'); }
          catch (e) { App.toast('恢复失败：' + e.message, 'err'); }
          App.refresh();
        });
      },
      snapDel: function (id) {
        var s = getSnaps().filter(function (x) { return x.id === id; })[0]; if (!s) return;
        confirmBox('删除方案', '<p>确定删除方案「<b>' + esc(s.name) + '</b>」吗？删除后无法恢复。</p>', '删除', function () {
          try { Store.deleteSnapshot(id); App.toast('已删除方案「' + s.name + '」', 'ok'); }
          catch (e) { App.toast('删除失败：' + e.message, 'err'); }
          App.refresh();
        }, true);
      },
      reset: function () {
        confirmBox('恢复为原始课表', '<p>将<b>丢弃全部修改</b>（班级、老师、教学任务、课表、学期设置），回到最初的原始课表。</p><p>建议先「保存当前为方案」或「导出备份文件」。</p>', '继续', function () {
          setTimeout(function () {
            confirmBox('再次确认', '<p class="pk-ad-warn">真的要恢复为原始课表吗？</p>', '确定恢复', function () {
              try { Store.resetToSeed(); App.toast('已恢复为原始课表', 'ok'); }
              catch (e) { App.toast('恢复失败：' + e.message, 'err'); }
            }, true);
          }, 0);
        }, true);
      }
    };
    root.addEventListener('click', function (e) {
      var t = e.target.closest('[data-act]'); if (!t) return;
      var f = acts[t.getAttribute('data-act')]; if (f) { e.preventDefault(); f(t.getAttribute('data-id')); }
    });
  }

  App.registerView('data', { title: '数据与导出', render: render });
})();
</script>
</body>
</html>
